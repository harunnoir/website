<style>
  :root {
    --void:      #0a0401;
    --abyss:     #150a04;
    --deep:      #2b1408;
    --brown:     #4a2814;
    --umber:     #6f3b1c;
    --bronze:    #8b5a2b;
    --gold:      #b07a47;
    --amber:     #d6a56c;
    --cream:     #e8c99a;
    --glow:      rgba(176,122,71,0.18);
    --glow-hot:  rgba(214,165,108,0.3);
    --glass-bg:  rgba(20,8,3,0.55);
    --glass-bdr: rgba(176,122,71,0.25);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--void);
    color: var(--amber);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
    cursor: none;
  }

  /* ── CURSOR ── */
  #cursor {
    position: fixed; width: 10px; height: 10px; border-radius: 50%;
    background: var(--gold); pointer-events: none; z-index: 9999;
    transform: translate(-50%,-50%); mix-blend-mode: screen;
    box-shadow: 0 0 18px 4px var(--glow-hot);
    transition: opacity 0.3s;
  }
  #cursor-ring {
    position: fixed; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid rgba(176,122,71,0.45); pointer-events: none;
    z-index: 9998; transform: translate(-50%,-50%);
    transition: width 0.3s, height 0.3s, border-color 0.3s;
  }

  /* ── GRAIN ── */
  #grain {
    position: fixed; inset: -50%; width: 200%; height: 200%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 128px 128px; opacity: 0.045; pointer-events: none; z-index: 9988;
    animation: grain 7s steps(10) infinite;
  }
  @keyframes grain {
    0%,100%{transform:translate(0,0)} 10%{transform:translate(-2%,-3%)}
    20%{transform:translate(3%,1%)} 30%{transform:translate(-1%,4%)}
    40%{transform:translate(4%,-2%)} 50%{transform:translate(-3%,3%)}
    60%{transform:translate(2%,-4%)} 70%{transform:translate(-4%,1%)}
    80%{transform:translate(1%,3%)} 90%{transform:translate(3%,-1%)}
  }

  /* ── LAYERED OVERLAYS ── */
  #overlay-grad {
    position: fixed; inset: 0; z-index: 1;
    background:
      linear-gradient(to bottom,
        rgba(10,4,1,0.72) 0%,
        rgba(10,4,1,0.18) 28%,
        rgba(10,4,1,0.08) 50%,
        rgba(10,4,1,0.38) 72%,
        rgba(10,4,1,0.92) 100%),
      radial-gradient(ellipse at 50% 45%, transparent 25%, rgba(5,2,1,0.65) 100%);
  }
  /* Warm sepia wash */
  #overlay-sepia {
    position: fixed; inset: 0; z-index: 2;
    background: radial-gradient(ellipse at 50% 40%,
      rgba(111,59,28,0.10) 0%,
      rgba(43,20,8,0.22) 60%,
      rgba(10,4,1,0.45) 100%);
    mix-blend-mode: multiply;
  }
  /* Vignette */
  #vignette {
    position: fixed; inset: 0; z-index: 3;
    background: radial-gradient(ellipse at center,
      transparent 28%, rgba(5,2,1,0.6) 72%, rgba(2,1,0,0.92) 100%);
    pointer-events: none;
  }
  /* Center warm glow — where the hands meet */
  #center-glow {
    position: fixed; inset: 0; z-index: 4;
    background: radial-gradient(ellipse 55% 30% at 52% 52%,
      rgba(176,122,71,0.09) 0%, transparent 100%);
    pointer-events: none;
    animation: glow-pulse 6s ease-in-out infinite;
  }
  @keyframes glow-pulse {
    0%,100%{opacity:0.7} 50%{opacity:1}
  }
  /* Horizontal light streak across fingertip zone */
  #light-streak {
    position: fixed; left: 0; right: 0; top: 46%; height: 2px;
    z-index: 5; pointer-events: none;
    background: linear-gradient(90deg,
      transparent 5%, rgba(214,165,108,0.07) 30%,
      rgba(214,165,108,0.18) 50%,
      rgba(214,165,108,0.07) 70%, transparent 95%);
    filter: blur(8px);
    animation: streak-breathe 7s ease-in-out infinite;
  }
  @keyframes streak-breathe {
    0%,100%{opacity:0.5;transform:scaleY(1)} 50%{opacity:1;transform:scaleY(2.5)}
  }

  /* ── LOADER ── */
  #loader {
    position: fixed; inset: 0; background: var(--void); z-index: 9995;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    transition: opacity 1s ease, visibility 1s ease;
  }
  #loader.hide { opacity: 0; visibility: hidden; }
  .loader-glyph {
    font-family: 'Cinzel', serif; font-size: clamp(2.4rem,6vw,3.8rem); font-weight: 700;
    letter-spacing: 0.4em; color: transparent;
    background: linear-gradient(135deg, var(--brown), var(--gold), var(--cream), var(--gold), var(--brown));
    background-size: 300% 300%; -webkit-background-clip: text; background-clip: text;
    animation: shimmer-text 2.5s ease infinite;
  }
  .loader-line { width: 160px; height: 1px; background: rgba(111,59,28,0.18); position: relative; overflow: hidden; }
  .loader-line::after {
    content:''; position: absolute; top:0; left:-100%; width:100%; height:100%;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: sweep 1.5s ease-in-out infinite;
  }
  @keyframes sweep { 0%{left:-100%} 100%{left:100%} }
  .loader-sub {
    font-family:'Cormorant Garamond',serif; font-style:italic; font-size:0.82rem;
    letter-spacing:0.32em; color:var(--umber); opacity:0.65; text-transform:uppercase;
  }

  /* ── MAIN ── */
  #main {
    position: relative; z-index: 10; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start; padding: 80px 20px 80px;
    opacity: 0; transform: translateY(18px);
    transition: opacity 1.4s ease, transform 1.4s ease;
  }
  #main.visible { opacity: 1; transform: translateY(0); }

  /* ── PROFILE ── */
  .profile-frame {
    position: relative;
    width: clamp(118px,20vw,152px); height: clamp(118px,20vw,152px);
    margin-bottom: 38px;
    animation: float 8s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-11px)} }

  .profile-glow {
    position: absolute; inset: -28px; border-radius: 50%;
    background: radial-gradient(circle, rgba(176,122,71,0.32) 0%, transparent 70%);
    animation: pg 5s ease-in-out infinite;
  }
  @keyframes pg { 0%,100%{opacity:0.5;transform:scale(1)} 50%{opacity:1;transform:scale(1.12)} }

  .profile-ring {
    position: absolute; inset: -7px; border-radius: 50%;
    background: conic-gradient(from 0deg,
      #2b1408, #b07a47, #d6a56c, #e8c99a, #d6a56c, #b07a47, #6f3b1c, #2b1408);
    animation: ring-spin 14s linear infinite;
  }
  @keyframes ring-spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  .profile-ring-mask {
    position: absolute; inset: -3px; border-radius: 50%; background: var(--void);
  }
  /* Extra shimmer ring */
  .profile-ring2 {
    position: absolute; inset: -14px; border-radius: 50%;
    border: 1px solid rgba(176,122,71,0.18);
    animation: ring-spin 22s linear infinite reverse;
  }
  .profile-ring3 {
    position: absolute; inset: -20px; border-radius: 50%;
    border: 1px dashed rgba(111,59,28,0.12);
    animation: ring-spin 35s linear infinite;
  }

  .profile-img-wrap {
    position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
  }
  .profile-img-wrap img {
    width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
    filter: sepia(0.12) contrast(1.08) brightness(0.96);
  }

  /* ── NAME ── */
  .creator-name {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.85rem,5vw,2.9rem);
    letter-spacing: 0.12em;
    text-align: center;
    margin-bottom: 8px;
    background: linear-gradient(135deg,
      var(--bronze) 0%, var(--amber) 35%, var(--cream) 52%,
      var(--amber) 68%, var(--bronze) 100%);
    background-size: 260% 260%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer-text 5s ease-in-out infinite;
    line-height: 1.1;
  }
  @keyframes shimmer-text {
    0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%}
  }
  .name-harun { font-weight: 700; letter-spacing: 0.24em; }
  .name-noir  { font-weight: 400; font-style: italic; letter-spacing: 0.32em; }

  .creator-handle {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: clamp(0.92rem,2.4vw,1.12rem);
    color: var(--bronze); letter-spacing: 0.24em; margin-bottom: 24px; opacity: 0.8;
  }

  .divider {
    width: 90px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 22px; opacity: 0.45;
  }

  .creator-bio {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: clamp(1rem,2.5vw,1.18rem); font-weight: 300;
    color: var(--bronze); text-align: center; max-width: 340px;
    line-height: 1.9; margin-bottom: 54px; opacity: 0.78; letter-spacing: 0.04em;
  }

  /* ── LINKS ── */
  .links-wrap {
    display: flex; flex-direction: column; gap: 13px;
    width: 100%; max-width: 420px;
  }

  .link-btn {
    position: relative; display: flex; align-items: center; gap: 16px;
    padding: 16px 26px; border-radius: 13px; text-decoration: none;
    overflow: hidden; cursor: none;
    border: 1px solid var(--glass-bdr);
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    transition: transform 0.38s cubic-bezier(.23,1,.32,1),
                border-color 0.3s, box-shadow 0.38s;
    opacity: 0; transform: translateY(22px);
  }
  .link-btn.appear {
    animation: btn-appear 0.75s cubic-bezier(.23,1,.32,1) forwards;
  }
  @keyframes btn-appear { to{opacity:1;transform:translateY(0)} }

  /* inner warm wash */
  .link-btn::before {
    content:''; position:absolute; inset:0;
    background: linear-gradient(120deg,
      rgba(176,122,71,0.07) 0%,
      rgba(214,165,108,0.04) 50%,
      rgba(176,122,71,0.07) 100%);
    opacity:0; transition:opacity 0.3s;
  }
  /* shimmer sweep */
  .link-btn::after {
    content:''; position:absolute; top:0; left:-160%; width:60%; height:100%;
    background: linear-gradient(108deg, transparent 20%, rgba(232,201,154,0.13) 50%, transparent 80%);
    transform: skewX(-14deg); transition: left 0.65s ease;
  }
  .link-btn:hover {
    transform: translateY(-3px) scale(1.016);
    border-color: rgba(176,122,71,0.6);
    box-shadow:
      0 0 0 1px rgba(214,165,108,0.1),
      0 10px 45px rgba(74,40,20,0.55),
      0 0 70px rgba(176,122,71,0.1),
      inset 0 1px 0 rgba(232,201,154,0.14);
  }
  .link-btn:hover::before { opacity:1; }
  .link-btn:hover::after  { left:150%; }
  .link-btn:active { transform:translateY(-1px) scale(1.006); }

  .btn-icon-wrap {
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    background: linear-gradient(145deg, rgba(111,59,28,0.5), rgba(20,8,3,0.85));
    border: 1px solid rgba(176,122,71,0.28);
    display:flex; align-items:center; justify-content:center;
    transition: box-shadow 0.35s, border-color 0.3s;
  }
  .link-btn:hover .btn-icon-wrap {
    border-color: rgba(214,165,108,0.65);
    box-shadow: 0 0 20px rgba(176,122,71,0.45), inset 0 1px 0 rgba(214,165,108,0.2);
  }
  .btn-icon { width:19px; height:19px; fill:var(--gold); transition:fill 0.3s; }
  .link-btn:hover .btn-icon { fill:var(--cream); }

  .btn-label {
    font-family:'Cinzel',serif; font-size:0.8rem; font-weight:500;
    letter-spacing:0.22em; text-transform:uppercase;
    color:var(--amber); transition:color 0.3s; flex:1;
  }
  .link-btn:hover .btn-label { color:var(--cream); }

  .btn-arrow {
    font-size:0.72rem; color:var(--bronze); opacity:0;
    transform:translateX(-8px);
    transition:opacity 0.3s, transform 0.3s, color 0.3s;
  }
  .link-btn:hover .btn-arrow { opacity:1; transform:translateX(0); color:var(--amber); }

  /* ── ORNAMENT ── */
  .ornament {
    display:flex; align-items:center; gap:16px; margin:54px 0 20px;
    width:100%; max-width:420px; opacity:0.32;
  }
  .ornament-line { flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--gold)); }
  .ornament-line.rev { background:linear-gradient(270deg,transparent,var(--gold)); }
  .ornament-glyph { font-family:'Cinzel',serif; font-size:0.65rem; color:var(--gold); letter-spacing:0.3em; }

  /* ── FOOTER ── */
  footer {
    font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size:0.78rem; color:var(--umber); letter-spacing:0.22em;
    opacity:0.45; text-align:center;
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width:3px; }
  ::-webkit-scrollbar-track { background:var(--abyss); }
  ::-webkit-scrollbar-thumb { background:linear-gradient(180deg,var(--brown),var(--bronze)); border-radius:3px; }

  /* ── MUSIC TOGGLE ── */
  #music-btn {
    position:fixed; bottom:26px; right:26px; z-index:200;
    width:44px; height:44px; border-radius:50%;
    background:rgba(20,8,3,0.6); border:1px solid var(--glass-bdr);
    backdrop-filter:blur(12px); display:flex; align-items:center; justify-content:center;
    cursor:none; transition:border-color 0.3s, box-shadow 0.3s, transform 0.3s;
    opacity:0; animation:fade-up 1s ease 2.8s forwards;
  }
  #music-btn:hover { border-color:rgba(176,122,71,0.6); box-shadow:0 0 22px rgba(176,122,71,0.28); transform:scale(1.1); }
  @keyframes fade-up { to{opacity:1} }

  @media (max-width:480px) {
    .link-btn { padding:14px 18px; }
    .btn-icon-wrap { width:36px; height:36px; }
    .btn-icon { width:16px; height:16px; }
    .btn-label { font-size:0.74rem; }
  }
</style>
</head>

    <path d="M9 18V5l12-2v13M9 18c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-2c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z"
      fill="none" stroke="#b07a47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<script>
/* ── CURSOR ── */
const cur=document.getElementById('cursor'),ring=document.getElementById('cursor-ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{
  mx=e.clientX;my=e.clientY;
  cur.style.left=mx+'px';cur.style.top=my+'px';
});
(function loop(){
  rx+=(mx-rx)*0.11;ry+=(my-ry)*0.11;
  ring.style.left=rx+'px';ring.style.top=ry+'px';
  requestAnimationFrame(loop);
})();
document.querySelectorAll('a,button').forEach(el=>{
  el.addEventListener('mouseenter',()=>{ring.style.width='54px';ring.style.height='54px';ring.style.borderColor='rgba(214,165,108,0.7)';});
  el.addEventListener('mouseleave',()=>{ring.style.width='34px';ring.style.height='34px';ring.style.borderColor='rgba(176,122,71,0.45)';});
});

/* ── LOADER ── */
window.addEventListener('load',()=>{
  setTimeout(()=>{
    document.getElementById('loader').classList.add('hide');
    const main=document.getElementById('main');
    main.classList.add('visible');
    document.querySelectorAll('.link-btn').forEach((btn,i)=>{
      setTimeout(()=>btn.classList.add('appear'),320+i*95);
    });
  },1800);
});

/* ── AMBIENT AUDIO ── */
let audioCtx=null,gainNode=null,isPlaying=false;
function buildAmbience(){
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  gainNode=audioCtx.createGain();
  gainNode.gain.setValueAtTime(0.001,audioCtx.currentTime);
  gainNode.connect(audioCtx.destination);
  [110,138.6,164.8,220,277.2,329.6].forEach((f,i)=>{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine';o.frequency.value=f;g.gain.value=0.045/(i+1);
    const lfo=audioCtx.createOscillator(),lg=audioCtx.createGain();
    lfo.frequency.value=0.08+i*0.035;lg.gain.value=0.02;
    lfo.connect(lg);lg.connect(g.gain);lfo.start();
    o.connect(g);g.connect(gainNode);o.start();
  });
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*4,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
  const s=audioCtx.createBufferSource();s.buffer=buf;s.loop=true;
  const flt=audioCtx.createBiquadFilter();flt.type='lowpass';flt.frequency.value=180;
  const ng=audioCtx.createGain();ng.gain.value=0.01;
  s.connect(flt);flt.connect(ng);ng.connect(gainNode);s.start();
}
document.getElementById('music-btn').addEventListener('click',()=>{
  if(!audioCtx)buildAmbience();
  if(audioCtx.state==='suspended')audioCtx.resume();
  isPlaying=!isPlaying;
  gainNode.gain.cancelScheduledValues(audioCtx.currentTime);
  gainNode.gain.linearRampToValueAtTime(isPlaying?0.6:0.001,audioCtx.currentTime+2);
  document.querySelector('#music-btn svg').style.opacity=isPlaying?'1':'0.4';
});
</script>
</body>
</html>
