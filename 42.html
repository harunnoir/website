<button id="music-btn" title="Toggle Rain Sound" aria-label="Toggle rain sounds">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#b07a47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 0 0 4 14.9"/>
    <line x1="8" y1="19" x2="8" y2="21"/>
    <line x1="12" y1="17" x2="12" y2="19"/>
    <line x1="16" y1="19" x2="16" y2="21"/>
  </svg>
</button>
<div id="rain-hint">click for rain</div>
<div id="rain-tooltip">Play rain</div>

<script>
const cur=document.getElementById('cursor'),ring=document.getElementById('cursor-ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{
  mx=e.clientX;my=e.clientY;
  cur.style.left=mx+'px';cur.style.top=my+'px';
});
(function loop(){
  rx+=(mx-rx)*0.12;ry+=(my-ry)*0.12;
  ring.style.left=rx+'px';ring.style.top=ry+'px';
  requestAnimationFrame(loop);
})();
document.querySelectorAll('a,button').forEach(el=>{
  el.addEventListener('mouseenter',()=>{ring.style.width='54px';ring.style.height='54px';ring.style.borderColor='rgba(214,165,108,0.7)';});
  el.addEventListener('mouseleave',()=>{ring.style.width='34px';ring.style.height='34px';ring.style.borderColor='rgba(176,122,71,0.45)';});
});

const mb=document.getElementById('music-btn'),rt=document.getElementById('rain-tooltip');
mb.addEventListener('mouseenter',()=>rt.classList.add('show'));
mb.addEventListener('mouseleave',()=>rt.classList.remove('show'));

/* ── LOADER + APPEAR ── */
window.addEventListener('load',()=>{
  setTimeout(()=>{
    document.getElementById('loader').classList.add('hide');
    const main=document.getElementById('main');
    main.classList.add('visible');
    document.querySelectorAll('.skill-tag').forEach((el,i)=>{
      setTimeout(()=>el.classList.add('appear'),420+i*70);
    });
    const rh=document.getElementById('rain-hint');
    rh.classList.add('show');
    setTimeout(()=>rh.classList.add('hide'),3500);
    setTimeout(()=>rh.classList.remove('show'),4200);
  },1800);
});

/* ── AMBIENT AUDIO ── */
const sounds=['asset/sounds/rain-sounds.opus','asset/sounds/moonlight.opus'];
let audio=null,isPlaying=false,fadeTimer=null;
document.getElementById('music-btn').addEventListener('click',()=>{
  if(!isPlaying){
    const src=sounds[Math.floor(Math.random()*sounds.length)];
    if(audio){audio.pause();audio=null;}
    audio=new Audio(src);
    audio.loop=true;
    audio.volume=0;
    audio.play();
  }
  isPlaying=!isPlaying;
  const target=isPlaying?0.6:0;
  if(fadeTimer)clearInterval(fadeTimer);
  fadeTimer=setInterval(()=>{
    const d=target-audio.volume;
    if(Math.abs(d)<0.015){
      audio.volume=target;
      clearInterval(fadeTimer);fadeTimer=null;
      if(!isPlaying){audio.pause();audio.currentTime=0;}
    }else{
      audio.volume+=Math.sign(d)*0.025;
    }
  },40);
  document.querySelector('#music-btn svg').style.opacity=isPlaying?'1':'0.35';
  document.getElementById('rain-tooltip').textContent=isPlaying?'Pause rain':'Play rain';
});
</script>
</body>
